name: ci

on:
  push:
  pull_request:

# Public repository. Jobs run on GitHub-hosted runners. There is no deploy job.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[service,test]"
          python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hypermesh-pricing:ci .
