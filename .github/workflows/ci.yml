name: ci

on:
  push:
  pull_request:

# Public repository. Jobs run on GitHub-hosted runners. There is no deploy job.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[service,test]"
          python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t hypermesh-pricing:ci .
      - name: Check startup and /healthz
        run: bash scripts/smoke-image.sh hypermesh-pricing:ci
