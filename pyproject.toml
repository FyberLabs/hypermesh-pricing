[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-core"
version = "0.1.0"
description = "Hypermesh pricing engine: pure clearing core and a stateless internal service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
service = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "fastapi>=0.115",
]

[tool.setuptools.packages.find]
include = ["pricing_core*", "pricing_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
