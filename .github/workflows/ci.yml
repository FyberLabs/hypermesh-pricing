name: ci

on:
  push:
  pull_request:

# Public repository. Jobs run on GitHub-hosted runners. There is no deploy job.
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[service,test]"
          python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t hypermesh-pricing:ci .
      - name: Check startup and /healthz
        run: bash scripts/smoke-image.sh hypermesh-pricing:ci
