name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to pin (vX.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "Print the digest and compose diff and do not open a pull request"
        required: false
        type: boolean
        default: false

# Public repository. GitHub-hosted runners. There is no deploy job.
# A push to main publishes :main and :sha-<commit>.
# A v* tag publishes that tag. The bump job then resolves that digest and
# opens or updates one pull request in the panopticon repository.
# workflow_dispatch pins an image that is already in GHCR. dry_run stops
# before any pull request. The bump job reads its App key only from the
# panopticon-bump environment. It does not run for a pull request.
permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hypermesh-pricing:candidate .
      - name: Check startup and /healthz
        run: bash scripts/smoke-image.sh hypermesh-pricing:candidate
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and print digest
        id: push
        run: |
          set -euo pipefail
          image="ghcr.io/fyberlabs/hypermesh-pricing"
          tags=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags+=("main")
            tags+=("sha-${GITHUB_SHA}")
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "no image tags for ${GITHUB_REF}" >&2
            exit 1
          fi
          push_log="$(mktemp)"
          trap 'rm -f "$push_log"' EXIT
          for tag in "${tags[@]}"; do
            docker tag hypermesh-pricing:candidate "${image}:${tag}"
            docker push "${image}:${tag}" | tee -a "$push_log"
          done
          prefix="${image}@sha256:"
          ref=""
          digest_lines="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "${image}:${tags[0]}")"
          while IFS= read -r line; do
            case "$line" in
              "${prefix}"[0-9a-f]*) ref="$line"; break ;;
            esac
          done <<< "$digest_lines"
          if [ -z "$ref" ]; then
            digest="$(sed -n 's/.*\(sha256:[0-9a-f]\{64\}\).*/\1/p' "$push_log" | head -n 1)"
            if [ -z "$digest" ]; then
              echo "docker push did not print a digest" >&2
              exit 1
            fi
            ref="${image}@${digest}"
          fi
          echo "Pin the running image by that digest. The tag can move; the digest cannot."
          echo "image digest: ${ref}"
          digest="${ref#*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ref is not a digest pin" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' "image digest: ${ref}" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN usually cannot PATCH org package visibility. A miss
          # must not fail the release: the image is already pushed. Do not
          # write the step summary here; the digest line above stays last.
          path="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hypermesh-pricing"
          set +e
          body="$(gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "$path" \
            -f visibility=public 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "package visibility: public"
            exit 0
          fi
          echo "WARNING: could not set the GHCR package visibility to public. The image was already pushed." >&2
          echo "WARNING: one-time fix: set the package public in the org package settings, or link it to the repo." >&2
          printf '%s\n' "$body" >&2
          exit 0

  # One pull request in panopticon. Not a deploy.
  # The App private key is an environment secret. actions/create-github-app-token
  # mints the App JWT in this job only. GITHUB_TOKEN is not used to write panopticon.
  bump-panopticon:
    needs: image
    if: >-
      always() &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      (
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    environment: panopticon-bump
    concurrency:
      group: panopticon-pin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PANOPTICON_BUMP_APP_ID }}
          private-key: ${{ secrets.PANOPTICON_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: panopticon
          permission-contents: write
          permission-pull-requests: write
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve dispatched tag digest
        if: github.event_name == 'workflow_dispatch'
        id: dispatched
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/resolve_pricing_digest.py
      - name: Open or update the panopticon pin pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PANOPTICON_OWNER: ${{ github.repository_owner }}
          PANOPTICON_REPO: panopticon
          PRICING_REPOSITORY: ${{ github.repository }}
          PRICING_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PRICING_DIGEST: ${{ github.event_name == 'workflow_dispatch' && steps.dispatched.outputs.digest || needs.image.outputs.digest }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python3 scripts/bump_panopticon_pin.py
